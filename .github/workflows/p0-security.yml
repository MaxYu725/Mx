name: Mx P0 security checks

on:
  pull_request:
    paths:
      - 'js/**'
      - 'tests/p0-security.test.cjs'
      - '.github/workflows/p0-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check js/cards.js
          node --check js/engine.js
          node --check js/session.js
          node --check js/ui.js
      - name: P0 network and rules regression
        run: node --test tests/p0-security.test.cjs
